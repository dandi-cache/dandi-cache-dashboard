name: Dashboard

# Draws the table of every cache and publishes it to the `dashboard` branch, which the README embeds.
# The branch holds a single commit that every run replaces, so it keeps no history of its own.

on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths: [code/**, .github/workflows/dashboard.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  Dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write the diagram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 code/dashboard.py --mermaid > "${RUNNER_TEMP}/diagram.mmd"

      # Mermaid's own layout decides where each cache sits in the README's diagram, and the table's
      # rows follow it. Without the drawing, the rows fall back to an approximation of it.
      - name: Lay out the diagram
        continue-on-error: true
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          echo '{"args": ["--no-sandbox"]}' > "${RUNNER_TEMP}/puppeteer.json"
          npx --yes @mermaid-js/mermaid-cli@11.4.2 --puppeteerConfigFile "${RUNNER_TEMP}/puppeteer.json" \
            --input "${RUNNER_TEMP}/diagram.mmd" --output "${RUNNER_TEMP}/diagram.svg"

      - name: Draw the dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 code/dashboard.py --output "${RUNNER_TEMP}/dashboard" --layout "${RUNNER_TEMP}/diagram.svg"

      - name: Publish to the dashboard branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ runner.temp }}/dashboard
        run: |
          git init -q -b dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.svg dashboard.tsv
          git commit -q -m "Draw the dashboard"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dashboard
